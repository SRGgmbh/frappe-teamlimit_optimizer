[project]
name = "teamlimit_optimizer"
authors = [
    { name = "SRG - Systemhaus GmbH", email = "consulting@srg.gmbh" }
]
description = "Makes full use of Claude Team plan limits: live usage of all members, who can take over work, and a shared task pool – for Claude by Anthropic"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/SRGgmbh/frappe-teamlimit_optimizer"
Repository = "https://github.com/SRGgmbh/frappe-teamlimit_optimizer"
Issues = "https://github.com/SRGgmbh/frappe-teamlimit_optimizer/issues"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
